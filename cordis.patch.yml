# dsh-data-migration bundle patch: inserts its plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (loopback-fenced
# /api/dsh-data-migration routes, container crypto, profile installer) and the
# browser side served from this package's built ./client export.
- insert:
    - id: dsh-data-migration
      name: dsh-data-migration
